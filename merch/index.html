<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4ecd8" />
    <meta name="description" content="NOSTERA T-shirts in white and black, with our colourful sun motif. Discover the photographs and details." />
    <title>Merch | NOSTERA</title>
    <link rel="preload" href="../assets/fonts/PirataOne-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="merch.css" />
    <script src="merch.js" defer></script>
  </head>
  <body class="merch-page">
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="NOSTERA - Startseite">NOSTERA</a>
    </header>
    <main class="merch-main">
      <div class="merch-intro">
        <h1>Merch</h1>
        <p>Two colours.<br />One little sun.</p>
      </div>
      <div class="merch-products">
        <article class="merch-product" aria-labelledby="white-title">
          <figure class="product-gallery">
            <a class="product-zoom" href="../assets/merch/white-front-v2-large.webp" aria-label="White NOSTERA T-shirt with the sun motif, hanging from a branch in the woods – enlarge photograph">
              <img id="white-photo" class="product-hero" src="../assets/merch/white-front-v2.webp" srcset="../assets/merch/white-front-v2.webp 800w, ../assets/merch/white-front-v2-large.webp 1086w" sizes="(max-width: 540px) calc(100vw - 48px), (max-width: 760px) calc((100vw - 76px) / 2), (max-width: 1168px) calc((100vw - 144px) / 2), 512px" width="800" height="1066" alt="White NOSTERA T-shirt with the sun motif, hanging from a branch in the woods" fetchpriority="high" />
              <span class="product-zoom-label" aria-hidden="true">+</span>
            </a>
            <figcaption class="product-gallery-caption"><span class="product-gallery-view">Front</span><span class="product-gallery-count" aria-live="polite" aria-atomic="true">1 / 2</span></figcaption>
            <nav class="product-thumbnails" aria-label="White T-shirt photographs">
              <a class="product-thumbnail" href="../assets/merch/white-front-v2-large.webp" data-src="../assets/merch/white-front-v2.webp" data-srcset="../assets/merch/white-front-v2.webp 800w, ../assets/merch/white-front-v2-large.webp 1086w" data-alt="White NOSTERA T-shirt with the sun motif, hanging from a branch in the woods" data-view="Front" aria-label="White T-shirt: front" aria-controls="white-photo" aria-current="true">
                <img src="../assets/merch/white-front-v2-thumb.webp" width="120" height="160" alt="" loading="lazy" />
              </a>
              <a class="product-thumbnail" href="../assets/merch/white-detail-v2-large.webp" data-src="../assets/merch/white-detail-v2.webp" data-srcset="../assets/merch/white-detail-v2.webp 800w, ../assets/merch/white-detail-v2-large.webp 1086w" data-alt="Close-up of the colourful NOSTERA sun motif on the white T-shirt" data-view="Detail" aria-label="White T-shirt: detail" aria-controls="white-photo">
                <img src="../assets/merch/white-detail-v2-thumb.webp" width="120" height="160" alt="" loading="lazy" />
              </a>
            </nav>
          </figure>
          <div class="product-info">
            <div class="product-heading"><h2 id="white-title">White</h2><p>NOSTERA T-shirt</p></div>
            <p class="product-description">Our colourful sun motif on a white T-shirt.</p>
            <p class="product-price">12,00&nbsp;€</p>
          </div>
        </article>
        <article class="merch-product" aria-labelledby="black-title">
          <figure class="product-gallery">
            <a class="product-zoom" href="../assets/merch/black-front-v2-large.webp" aria-label="Black NOSTERA T-shirt with the sun motif, hanging from a branch in the woods – enlarge photograph">
              <img id="black-photo" class="product-hero" src="../assets/merch/black-front-v2.webp" srcset="../assets/merch/black-front-v2.webp 800w, ../assets/merch/black-front-v2-large.webp 1086w" sizes="(max-width: 540px) calc(100vw - 48px), (max-width: 760px) calc((100vw - 76px) / 2), (max-width: 1168px) calc((100vw - 144px) / 2), 512px" width="800" height="1066" alt="Black NOSTERA T-shirt with the sun motif, hanging from a branch in the woods" fetchpriority="high" />
              <span class="product-zoom-label" aria-hidden="true">+</span>
            </a>
            <figcaption class="product-gallery-caption"><span class="product-gallery-view">Front</span><span class="product-gallery-count" aria-live="polite" aria-atomic="true">1 / 2</span></figcaption>
            <nav class="product-thumbnails" aria-label="Black T-shirt photographs">
              <a class="product-thumbnail" href="../assets/merch/black-front-v2-large.webp" data-src="../assets/merch/black-front-v2.webp" data-srcset="../assets/merch/black-front-v2.webp 800w, ../assets/merch/black-front-v2-large.webp 1086w" data-alt="Black NOSTERA T-shirt with the sun motif, hanging from a branch in the woods" data-view="Front" aria-label="Black T-shirt: front" aria-controls="black-photo" aria-current="true">
                <img src="../assets/merch/black-front-v2-thumb.webp" width="120" height="160" alt="" loading="lazy" />
              </a>
              <a class="product-thumbnail" href="../assets/merch/black-detail-v2-large.webp" data-src="../assets/merch/black-detail-v2.webp" data-srcset="../assets/merch/black-detail-v2.webp 800w, ../assets/merch/black-detail-v2-large.webp 1086w" data-alt="Close-up of the colourful NOSTERA sun motif on the black T-shirt" data-view="Detail" aria-label="Black T-shirt: detail" aria-controls="black-photo">
                <img src="../assets/merch/black-detail-v2-thumb.webp" width="120" height="160" alt="" loading="lazy" />
              </a>
            </nav>
          </figure>
          <div class="product-info">
            <div class="product-heading"><h2 id="black-title">Black</h2><p>NOSTERA T-shirt</p></div>
            <p class="product-description">Our colourful sun motif on a black T-shirt.</p>
            <p class="product-price">12,00&nbsp;€</p>
          </div>
        </article>
      </div>
    </main>
    <dialog class="product-lightbox" aria-label="Product photograph">
      <button class="product-lightbox-close" type="button" autofocus>Close ×</button>
      <img class="product-lightbox-image" alt="" />
      <p class="product-lightbox-caption"></p>
    </dialog>
    <footer class="site-footer">
      <nav aria-label="Rechtliche Informationen">
        <a href="../impressum/">Impressum</a>
        <a href="../datenschutz/">Datenschutz</a>
      </nav>
    </footer>
  </body>
</html>
